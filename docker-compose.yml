services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chosen_one
      POSTGRES_USER: chosen_one_dev
      POSTGRES_PASSWORD: chosen_one_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chosen_one_dev -d chosen_one"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend-development
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://chosen_one_dev:chosen_one_dev_password@db:5432/chosen_one
      FRONTEND_URL: http://localhost:5173
      # The supplied HubSpot export, mounted read-only below, so "Sync now" works in Compose.
      HUBSPOT_WORKBOOK_PATH: /reference/03-demo-data/HubSpot_OnDeck_Dummy_2026-10-01.xlsx
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./reference:/reference:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

