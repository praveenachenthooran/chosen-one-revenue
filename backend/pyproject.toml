[project]
name = "chosen-one-backend"
version = "0.1.0"
description = "Backend foundation for The Chosen One"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17.0,<2",
    "anthropic>=0.72.0,<1",
    "asyncpg>=0.30.0,<1",
    "authlib>=1.6.0,<2",
    "fastapi>=0.120.0,<1",
    "openpyxl>=3.1.5,<4",
    "pydantic-settings>=2.11.0,<3",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "uvicorn[standard]>=0.38.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pyright>=1.1.408,<2",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.2.0,<2",
    "ruff>=0.14.2,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["app", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

